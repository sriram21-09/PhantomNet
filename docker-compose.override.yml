## CPU-only fallback — disables NVIDIA GPU requirement
## Use this when no NVIDIA GPU is available or WSL2 GPU pass-through is not configured
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices: []
        limits:
          memory: 8G

  frontend:
    volumes:
      - ./frontend-dev/phantomnet-dashboard/dist:/usr/share/nginx/html:ro
