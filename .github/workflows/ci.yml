name: PhantomNet Unified CI/CD

on:
  push:
    branches: [ "main", "develop", "fix/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  backend-and-ml-tests:
    name: Backend & ML Pipeline Tests
    runs-on: ubuntu-latest
    env:
      SENTINEL_LLM_ENABLED: "false"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libpango-1.0-0 libpangoft2-1.0-0 libjpeg-dev zlib1g-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx

      - name: Configure MLflow & CI Environment
        run: |
          echo "MLFLOW_TRACKING_URI=file://$GITHUB_WORKSPACE/mlruns" >> $GITHUB_ENV
          echo "MLFLOW_REGISTRY_URI=file://$GITHUB_WORKSPACE/mlruns" >> $GITHUB_ENV
          mkdir -p mlruns data
          echo "length,threat_score,is_malicious,attack_type,timestamp,src_ip,dst_ip,dst_port,protocol,honeypot_type" > data/week6_mixed_events.csv
          echo "event,data" > data/week6_test_events.csv
          echo "login_failed,test_payload" >> data/week6_test_events.csv

      - name: Run ML Pipeline Tests
        run: |
          python -m pytest backend/tests/ml/ -v

      - name: Run Backend & Threat Intel Tests
        run: |
          python -m pytest backend/tests/test_taxii.py backend/tests/test_taxii_client.py backend/tests/test_llm_service.py backend/tests/test_sentinel_service_llm.py -v

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-dev/phantomnet-dashboard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-dev/phantomnet-dashboard/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Dashboard
        run: npm run build

  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit SAST
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST (Targeted Backend Scan)
        run: |
          bandit -r backend/ -x backend/venv,backend/tests,tests -ll --format custom --msg-template "{abspath}:{line}: {test_id}[bandit]: {severity}: {msg}" || true

      - name: Run Trivy Config Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
